name: Django CI/CD with Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ কোড চেকআউট
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2️⃣ Python সেটআপ
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    # 3️⃣ Docker সেটআপ
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # 4️⃣ Login to Docker Registry (Optional if using Docker Hub)
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5️⃣ Build Docker Image
    - name: Build Docker Image
      run: |
        docker build -t my-django-app .

    # 6️⃣ Run Lint & Tests inside Docker
    - name: Run Tests
      run: |
        docker run --rm my-django-app python manage.py test

    # 7️⃣ Push Docker Image to Docker Hub (Optional)
    - name: Push Docker Image
      run: |
        docker tag my-django-app ${{ secrets.DOCKER_USERNAME }}/my-django-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/my-django-app:latest

    # 8️⃣ Deploy to Server via SSH
    - name: Deploy to Server
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /home/ubuntu/myproject
          docker pull ${{ secrets.DOCKER_USERNAME }}/my-django-app:latest
          docker-compose down
          docker-compose up -d
